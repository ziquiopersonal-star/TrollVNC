name: Build TrollVNC Rootless
on: workflow_dispatch
permissions:
  contents: read
jobs:
  rootless:
    runs-on: macos-15
    env:
      FINALPACKAGE: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install ldid-procursus p7zip make
      - uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos-roothide
          submodules: recursive
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'
      - name: Install iOS SDK
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos-roothide"
          cd "$THEOS"
          ./bin/install-sdk iPhoneOS16.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build rootless package
        run: |
          source devkit/rootless.sh
          gmake clean package
      - uses: actions/upload-artifact@v4
        with:
          name: packages-rootless
          path: packages/*.deb
          if-no-files-found: error
